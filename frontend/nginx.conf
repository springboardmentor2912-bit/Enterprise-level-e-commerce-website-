# -----------------------------------------------------------------------------
# 1. HTTP Server Block (Port 80)
# Handles ACME SSL validation and redirects all regular HTTP traffic to HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge response path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Drop any legacy duckdns connections immediately
    if ($host ~* "duckdns\.org") {
        return 444;
    }

    # Redirect all HTTP requests directly to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# 2. HTTPS Server Block (Port 443)
# Production SSL/TLS Termination, React SPA routing, & Backend API Reverse Proxy
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name _;

    # Drop any legacy duckdns connections immediately
    if ($host ~* "duckdns\.org") {
        return 444;
    }

    # SSL Certificate Paths (Dynamic Active Certificate)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL Security Protocols & Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Increase body size limit for product and image uploads
    client_max_body_size 50M;

    # Enable Gzip Compression for optimal load times
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/javascript application/xml+rss image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # API Reverse Proxy to Spring Boot Backend
    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Uploaded Media Reverse Proxy to Spring Boot Backend
    location ^~ /uploads/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }

    # Static asset caching for React frontend assets (CSS, JS, Fonts, App Icons)
    location ~* \.(?:css|js|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
