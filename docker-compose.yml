services:

  # ==========================================
  # POSTGRESQL DATABASE
  # ==========================================

  db:
    image: postgres:17
    container_name: shopstack-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - shopstack-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # ==========================================
  # SHOPSTACK BACKEND
  # ==========================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: shopstack-backend
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      SERVER_PORT: 8080

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}

    ports:
      - "8081:8080"


  # ==========================================
  # SHOPSTACK FRONTEND
  # ==========================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api

    container_name: shopstack-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:80"


# ==========================================
# PERSISTENT DATABASE VOLUME
# ==========================================

volumes:
  shopstack-postgres-data:
    external: true
    name: shopstack-backend_shopstack-postgres-data