services:

  postgres:
    image: postgres:18
    container_name: shopstack-postgres
    environment:
      POSTGRES_DB: authentication_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authentication_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./authentication
      dockerfile: Dockerfile
    container_name: shopstack-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: authentication_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopstack-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: