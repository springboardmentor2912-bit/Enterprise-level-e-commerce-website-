version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopstack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - shopstack_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: shopstack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopstack-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8080:8080"

volumes:
  shopstack_pg_data:
