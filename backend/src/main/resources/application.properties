server.port=${PORT:8080}
server.address=0.0.0.0

# ── PostgreSQL ──────────────────────────────────────────────────────────────
# Set DB_URL, DB_USERNAME, DB_PASSWORD in your environment (Render / local)
# Local default: jdbc:postgresql://localhost:5432/shopstack_db
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopstack_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon (cloud) requires SSL — this is a no-op for local Postgres
spring.datasource.hikari.connection-init-sql=SELECT 1

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# ── JWT ─────────────────────────────────────────────────────────────────────
# MUST be at least 32 characters. Generate a strong random value for production.
app.jwt.secret=${JWT_SECRET:dev_only_change_this_in_production_use_strong_secret}
app.jwt.expiration-ms=86400000

# ── Razorpay ────────────────────────────────────────────────────────────────
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:placeholder_secret}

# ── JavaMailSender ──────────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.notification.from-email=${MAIL_FROM:noreply@shopstack.com}
app.notification.enabled=${MAIL_ENABLED:true}

# ── CORS ────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed origins.
# Example: https://shopstack.vercel.app,http://localhost:5173
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
